[package]
name = "herdr-hop"
version = "0.1.0"
edition = "2021"
description = "Herdr plugin: hop to any visible pane by pressing a labeled key, drawn as native Kitty-graphics overlays"
repository = "https://github.com/youguanxinqing/herdr-hop"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
